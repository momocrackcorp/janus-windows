name: Build JANUS Dock
on:
  workflow_dispatch:
  push:
    branches: [feature/janus-dock-v02]
    paths:
      - 'dock/**'
      - '.github/workflows/build-janus-dock.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows executable
        run: dotnet publish dock/JanusDock.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Dock-Windows-x64
          path: dist/JanusDock.exe
